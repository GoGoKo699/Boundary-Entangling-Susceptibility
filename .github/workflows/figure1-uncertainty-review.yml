name: figure1-uncertainty-review
on:
  push:
    branches: ['analysis/figure1-uncertainty-2026-09-08']
    paths:
      - 'analysis_plans/figure1_uncertainty_2026-09-08.json'
      - 'scripts/analysis/complete_figure1_uncertainty.py'
      - 'scripts/analysis/verify_figure1_uncertainty.py'
      - 'tests/test_figure1_uncertainty.py'
      - '.github/workflows/figure1-uncertainty-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-reproducible.txt
      - run: pip install -e .
      - run: python verify.py
      - run: pytest -q
      - run: python scripts/analysis/complete_figure1_uncertainty.py --output reproduced_figure1_uncertainty
      - run: python scripts/analysis/verify_figure1_uncertainty.py --output reproduced_figure1_uncertainty --report figure1_review_verification/independent_replay.json
      - name: Check the accepted artwork, canonical inputs, and original records are unchanged
        run: git diff --exit-code c54dca28464832ecebeb6602c4c490d3d68d3015 -- figures/ data/processed/core_figures/ entanglement-data.zip
      - uses: actions/upload-artifact@v4
        with:
          name: figure1-uncertainty-review-${{ github.sha }}
          path: |
            reproduced_figure1_uncertainty/
            figure1_review_verification/
          retention-days: 90
          if-no-files-found: error
# Read-only review. No figure replacement, push, automatic merge or history rewrite.

name: import-reviewed-entanglement-cleanup
on:
  push:
    branches: ['cleanup/entanglement-only-2026-09-08']
    paths: ['entanglement-cleanup-transfer.zip']
permissions:
  contents: read
concurrency:
  group: reviewed-entanglement-cleanup-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'GoGoKo699/Boundary-Entangling-Susceptibility' && github.ref == 'refs/heads/cleanup/entanglement-only-2026-09-08'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply the exact reviewed package
        run: python .github/tools/apply_verified_cleanup.py
      - run: pip install -r requirements-reproducible.txt
      - run: pip install -e .
      - run: python verify.py
      - run: pytest -q
      - run: python reproduce.py --core-figures
      - run: python scripts/analysis/reproduce_core_records.py --output reproduced_records
      - run: python scripts/analysis/reassess_evidence.py --output reproduced_evidence --bootstrap 5000 --seed 2026090501
      - run: python materialize_studies.py --output reproduced_studies
      - run: python studies/checkpoint_05/scripts/validate_tableau_against_statevector.py --clifford-table reproduced_studies/checkpoint_05/data/two_qubit_clifford_group.npz --maps reproduced_studies/checkpoint_05/data/two_qubit_clifford_symplectic_maps.npz --report reproduced_records/tableau_statevector.json
      - run: python studies/checkpoint_04/scripts/validate_gate_invariant_formula.py --out reproduced_records/gate_invariants.json --samples 100 --seed 123
      - uses: actions/upload-artifact@v4
        with:
          name: verified-entanglement-cleanup-${{ github.sha }}
          path: |
            reproduced_records/
            reproduced_evidence/
            reproduced_figures/
          if-no-files-found: error
          retention-days: 30
      - name: Commit only after verification; never force or update main
        run: |
          test "$GITHUB_REF" = refs/heads/cleanup/entanglement-only-2026-09-08
          remote_head=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$remote_head" = "$(git rev-parse HEAD)"
          test ! -f .github/workflows/import-reviewed-cleanup.yml
          test ! -f .github/tools/apply_verified_cleanup.py
          test ! -f entanglement-cleanup-transfer.zip
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Consolidate original-study records and remove stale repository dependencies'
          git push origin HEAD:"$GITHUB_REF"
# This one-time importer removes itself before committing. The normal final
# tests.yml is read-only. No automatic merge, release, license, or visibility change.

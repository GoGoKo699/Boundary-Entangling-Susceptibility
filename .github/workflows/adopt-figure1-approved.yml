name: adopt-approved-figure1
on:
  push:
    branches: ['analysis/figure1-uncertainty-2026-09-08']
    paths: ['.github/workflows/adopt-figure1-approved.yml']
permissions:
  contents: read
jobs:
  adopt:
    if: github.ref == 'refs/heads/analysis/figure1-uncertainty-2026-09-08'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-reproducible.txt
      - run: pip install -e .
      - name: Apply the hash-locked reviewed adoption on this branch only
        run: python .github/tools/adopt-figure1-approved.py
      - run: python verify.py
      - run: pytest -q
      - run: python reproduce.py --core-figures
      - run: python scripts/analysis/reproduce_core_records.py --output reproduced_records
      - name: Prepare review artifact without changing main
        run: |
          test ! -f .github/tools/adopt-figure1-approved.py
          test ! -f .github/workflows/adopt-figure1-approved.yml
          git add -A
          git archive --format=tar $(git write-tree) > "$RUNNER_TEMP/figure1-adopted-source.tar"
          git diff --cached --stat > "$RUNNER_TEMP/adoption-diff-stat.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: figure1-approved-adoption-${{ github.sha }}
          path: |
            ${{ runner.temp }}/figure1-adopted-source.tar
            ${{ runner.temp }}/adoption-diff-stat.txt
            reproduced_figure1_uncertainty/
            figure1_review_verification/
            reproduced_records/
            reproduced_figures/
          if-no-files-found: error
          retention-days: 90
      - name: Commit the checked adoption to the isolated review branch
        run: |
          test "$GITHUB_REF" = refs/heads/analysis/figure1-uncertainty-2026-09-08
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Adopt reviewed Figure 1 intervals and preserve historical provenance'
          git push origin HEAD:"$GITHUB_REF"
# One-time branch-only transport. Removed before its commit; never writes main,
# never forces refs, and never merges. All permanent workflows are read-only.

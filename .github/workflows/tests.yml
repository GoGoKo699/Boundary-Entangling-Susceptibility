name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-reproducible.txt
      - run: pip install -e .
      - run: pytest -q
      - run: python verify.py
      - run: python reproduce.py --core-figures
      - uses: actions/upload-artifact@v4
        with:
          name: core-figure-exports-${{ github.sha }}
          path: reproduced_figures/
          if-no-files-found: error
          retention-days: 30

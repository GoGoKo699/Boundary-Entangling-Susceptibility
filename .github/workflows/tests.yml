name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-reproducible.txt
      - run: pip install -e .
      - run: python verify.py
      - run: pytest -q
      - run: python reproduce.py --core-figures
      - uses: actions/upload-artifact@v4
        with:
          name: core-figure-exports-${{ github.sha }}
          path: reproduced_figures/
          if-no-files-found: error
          retention-days: 30
  recorded-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-reproducible.txt
      - run: pip install -e .
      - run: python scripts/analysis/reproduce_core_records.py --output reproduced_records
      - run: python scripts/analysis/reproduce_supporting_records.py --output reproduced_supporting_records --check
      - run: python scripts/analysis/reassess_evidence.py --output reproduced_evidence --bootstrap 5000 --seed 2026090501
      - run: python materialize_studies.py --output reproduced_studies
      - run: python studies/checkpoint_05/scripts/validate_tableau_against_statevector.py --clifford-table reproduced_studies/checkpoint_05/data/two_qubit_clifford_group.npz --maps reproduced_studies/checkpoint_05/data/two_qubit_clifford_symplectic_maps.npz --report reproduced_records/tableau_statevector.json
      - run: python studies/checkpoint_04/scripts/validate_gate_invariant_formula.py --out reproduced_records/gate_invariants.json --samples 100 --seed 123
      - uses: actions/upload-artifact@v4
        with:
          name: recorded-evidence-${{ github.sha }}
          path: |
            reproduced_records/
            reproduced_supporting_records/
            reproduced_evidence/
          if-no-files-found: error
          retention-days: 30

  figure1-uncertainty:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-reproducible.txt
      - run: pip install -e .
      - run: python scripts/analysis/complete_figure1_uncertainty.py --output reproduced_figure1_uncertainty
      - run: python scripts/analysis/verify_figure1_uncertainty.py --output reproduced_figure1_uncertainty --report figure1_review_verification/independent_replay.json
      - run: python scripts/analysis/check_figure1_adoption.py --resamples reproduced_figure1_uncertainty
      - uses: actions/upload-artifact@v4
        with:
          name: figure1-uncertainty-${{ github.sha }}
          path: |
            reproduced_figure1_uncertainty/
            figure1_review_verification/
          retention-days: 90
          if-no-files-found: error

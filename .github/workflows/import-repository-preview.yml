name: import-reviewed-repository-preview
on:
  push:
    branches: ['presentation/repository-preview-2026-09-08']
    paths: ['.github/workflows/import-repository-preview.yml']
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'GoGoKo699/Boundary-Entangling-Susceptibility'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Import reviewed text only
        run: python .github/tools/import_repository_preview.py
      - run: pip install -r requirements-reproducible.txt -r website/requirements-preview.txt
      - run: pip install -e .
      - name: Install the pinned document converter
        run: |
          curl --fail --location --retry 3 https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-linux-amd64.tar.gz -o "$RUNNER_TEMP/pandoc.tar.gz"
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pandoc-3.1.11.1/bin" >> "$GITHUB_PATH"
      - run: python -m playwright install --with-deps chromium
      - name: Generate and check the separate palette candidates
        run: python scripts/site/preview_figures.py --output "$RUNNER_TEMP/bes-irises"
      - name: Build and validate the source-derived site
        run: |
          python scripts/site/build.py --output "$RUNNER_TEMP/bes-site" --figures "$RUNNER_TEMP/bes-irises"
          python scripts/site/check.py --site "$RUNNER_TEMP/bes-site" --report "$RUNNER_TEMP/site-check.json"
      - name: Generate the in-repository previews
        run: |
          mkdir -p website/preview/irises
          cp "$RUNNER_TEMP/bes-irises/"* website/preview/irises/
          python scripts/site/capture_preview.py --site "$RUNNER_TEMP/bes-site" --output website/preview/images
      - run: python verify.py
      - run: pytest -q tests scripts/site/test_site.py
      - name: Check science preservation and stage only presentation files
        run: |
          git diff --exit-code 1059662eb7a8ad8bb3262ff4feddd9d95da71d00 -- docs/ figures/ data/ entanglement-data.zip analysis_plans/ src/ studies/ scripts/analysis/ scripts/figures/ tests/ .github/workflows/tests.yml
          git add README.md website/ scripts/site/
          git archive --format=tar $(git write-tree) > "$RUNNER_TEMP/preview-source.tar"
          git diff --cached --stat > "$RUNNER_TEMP/preview-diff.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-repository-preview-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bes-site/
            ${{ runner.temp }}/site-check.json
            ${{ runner.temp }}/preview-source.tar
            ${{ runner.temp }}/preview-diff.txt
          retention-days: 30
          if-no-files-found: error
      - name: Commit the reviewed preview to this branch only
        run: |
          test "$GITHUB_REF" = refs/heads/presentation/repository-preview-2026-09-08
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add a browsable repository preview and source-derived website'
          git push origin HEAD:"$GITHUB_REF"
# This temporary workflow is removed after the checked branch commit.
# It does not enable Pages, deploy a site, merge, force-push or change visibility.

name: apply-reviewed-science-docs
on:
  push:
    branches: ['docs/scientific-consolidation-2026-09-08']
    paths: ['.github/workflows/apply-science-docs.yml']
permissions:
  contents: read
concurrency:
  group: bes-science-consolidation-2026-09-08
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'GoGoKo699/Boundary-Entangling-Susceptibility' && github.ref == 'refs/heads/docs/scientific-consolidation-2026-09-08'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python .github/tools/apply_science_docs.py
      - run: pip install -r requirements-reproducible.txt
      - run: pip install -e .
      - run: python verify.py
      - run: pytest -q
      - name: Stage only the reviewed documentation and claim ledger
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          paths=json.loads((Path(os.environ['RUNNER_TEMP'])/'bes_science_paths.json').read_text())
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          if changed|untracked != set(paths):
              raise SystemExit('Unexpected working-tree changes; refuse to commit')
          subprocess.run(['git','add','--']+paths,check=True)
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert staged==set(paths)
          PY
      - name: Commit only to the isolated branch
        run: |
          test "$GITHUB_REF" = refs/heads/docs/scientific-consolidation-2026-09-08
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Consolidate the four-figure scientific account and exact sign corollary'
          git push origin HEAD:"$GITHUB_REF"
# The connector removes this temporary workflow and its payload after verification.
# This job does not alter workflows, main, figures, raw data, code, or statistical plans.

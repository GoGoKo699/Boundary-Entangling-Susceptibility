name: one-time-approved-figure4-export
on:
  push:
    branches: [approved-figure4-dialogue-2026-09-05]
    paths: [.github/workflows/one-time-figure4-sync.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.ref == 'refs/heads/approved-figure4-dialogue-2026-09-05'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-reproducible.txt
      - run: python reproduce.py --core-figures
      - name: Stage the single approved replacement panel
        run: |
          cp reproduced_figures/figure_04_distance_decay.pdf figures/core/
          cp reproduced_figures/figure_04_distance_decay.png figures/core/
          cp reproduced_figures/figure_04_distance_decay.svg figures/core_svg/
          git add figures/core/figure_04_distance_decay.pdf figures/core/figure_04_distance_decay.png figures/core_svg/figure_04_distance_decay.svg
      - name: Non-forced push to the review branch only
        run: |
          test "$GITHUB_REF" = refs/heads/approved-figure4-dialogue-2026-09-05
          remote_head=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$remote_head" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Export the approved Figure 4 without an exponential fit'
            git push origin HEAD:"$GITHUB_REF"
          fi
# Removed before merge. Never writes main; no force push or repeated trigger.

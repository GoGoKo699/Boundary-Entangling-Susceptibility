name: one-time-reviewed-branch-export
on:
  push:
    branches: [evidence-reassessment-2026-09-05]
    paths: [.github/workflows/one-time-export.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.ref == 'refs/heads/evidence-reassessment-2026-09-05'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-reproducible.txt
      - run: python reproduce.py --core-figures
      - name: Stage only the reviewed figure exports
        run: |
          mkdir -p figures/core figures/core_svg
          cp reproduced_figures/*.pdf reproduced_figures/*.png figures/core/
          cp reproduced_figures/*.svg figures/core_svg/
          git add figures/core/*.pdf figures/core/*.png figures/core_svg/*.svg
      - name: Non-forced push to the review branch only
        run: |
          test "$GITHUB_REF" = refs/heads/evidence-reassessment-2026-09-05
          remote_head=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          test "$remote_head" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Synchronize reviewed PDF PNG SVG exports on evidence branch'
            git push origin HEAD:"$GITHUB_REF"
          fi
# Temporary bootstrap for this review branch. Remove before merging to main.
# It never writes main, never force-pushes, and its output cannot retrigger it.

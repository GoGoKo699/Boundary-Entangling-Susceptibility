name: materialize-core-figures

on:
  push:
    paths:
      - ".github/workflows/materialize-core-figures.yml"
      - "reproduce.py"
      - "scripts/figures/**"
      - "data/processed/core_figures/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install figure dependencies
        run: pip install -r requirements.txt
      - name: Regenerate vector panels
        run: python reproduce.py --core-figures
      - name: Copy vector PDFs into the repository
        run: |
          mkdir -p figures/core
          cp reproduced_figures/*.pdf figures/core/
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/core/*.pdf
          if git diff --cached --quiet; then
            echo "Core PDFs are already current."
          else
            git commit -m "Materialize reproducible core figure PDFs"
            git push
          fi

# This workflow is intentionally path-limited so the bot's generated-PDF commit
# does not trigger another materialization run.

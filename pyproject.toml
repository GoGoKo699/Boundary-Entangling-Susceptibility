[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="boundary-entangling-susceptibility"
version="0.1.0"
description="Exact identities and reproducible analyses for boundary entangling susceptibility in monitored circuits"
requires-python=">=3.10"
dependencies=["numpy>=1.24","pandas>=2.0","scipy>=1.10","matplotlib>=3.7"]

[tool.setuptools.packages.find]
where=["src"]
